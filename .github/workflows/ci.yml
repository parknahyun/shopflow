name: CI

# 푸시와 PR마다 전체 테스트를 돌린다. 실패한 테스트가 있으면 머지할 수 없다(헌법 원칙 I, X).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # 도커가 있어 테스트컨테이너스를 쓸 수 있다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 전체 테스트
        run: ./gradlew test --no-daemon
      - name: 테스트 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
